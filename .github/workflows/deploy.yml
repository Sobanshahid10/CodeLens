name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK secret not set — skipping deploy trigger."
            echo "Add it at: Settings → Secrets → Actions → RENDER_DEPLOY_HOOK"
            exit 0
          fi
          echo "🚀 Triggering Render deploy..."
          curl -f -s -X POST "$RENDER_DEPLOY_HOOK" && echo "✅ Deploy triggered." || echo "❌ Deploy hook failed."
