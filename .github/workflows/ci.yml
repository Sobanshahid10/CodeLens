name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy sqlalchemy pydantic
      - run: ruff check .
      - run: mypy apps/ packages/ --ignore-missing-imports

  test:
    needs: [quality]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: codelens_test, POSTGRES_USER: codelens, POSTGRES_PASSWORD: testpass }
        options: "--health-cmd pg_isready --health-interval 5s --health-retries 10"
      redis:
        image: redis:7-alpine
      qdrant:
        image: qdrant/qdrant:v1.13.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "apps/api[test]" -e packages/core -e packages/ast-parser
      - run: pytest apps/ packages/ -v --cov --cov-report=xml
      - uses: codecov/codecov-action@v4

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only on tagged releases (e.g. v1.0.0) — requires OPENAI_API_KEY,
  # STAGING_API_URL, and EVAL_REPO_ID to be set in GitHub repo secrets.
  eval:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e apps/eval
      - name: Run RAGAS Evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_URL: ${{ secrets.STAGING_API_URL }}
        run: python apps/eval/run_eval.py --suite regression --repo-id ${{ secrets.EVAL_REPO_ID }} --fail-below-threshold
