name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install linters
        run: pip install ruff mypy sqlalchemy pydantic
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy apps/ packages/ --ignore-missing-imports

  test:
    name: Run Tests
    needs: [quality]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://codelens:testpass@localhost:5432/codelens_test
      REDIS_URL: redis://localhost:6379
      QDRANT_URL: http://localhost:6333
      JWT_SECRET: test-secret-key-32-characters-long
      ENVIRONMENT: test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: codelens_test
          POSTGRES_USER: codelens
          POSTGRES_PASSWORD: testpass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.13.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -e packages/core -e packages/ast-parser -e packages/llm-gateway
      - name: Run pytest
        run: pytest apps/ packages/ -v --cov --cov-report=xml
      - uses: codecov/codecov-action@v4
        continue-on-error: true
