[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/api/tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/worker/tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/eval/tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/eval/*" = ["ANN", "S108", "TC001", "TC002", "TC003"]
"apps/api/alembic/*" = ["ANN", "E501"]
"apps/api/app/*" = ["TC001", "TC002", "TC003", "S105", "S106", "S108"]
"packages/*" = ["TC001", "TC002", "TC003"]
"apps/worker/tasks/*" = ["TC001", "TC002", "TC003", "ANN", "S108"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "apps/api", "apps/worker", "apps/eval", "packages/ast-parser/src", "packages/llm-gateway/src", "packages/core/src"]
testpaths = ["apps/api/tests", "apps/worker/tests", "apps/eval/tests"]
