[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "TCH"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/api/tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/worker/tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/eval/tests/*" = ["S101", "S105", "S106", "ANN", "TC001", "TC002", "TC003"]
"apps/eval/*" = ["ANN", "S108", "TC001", "TC002", "TC003"]
"apps/api/alembic/*" = ["ANN", "E501"]
"apps/api/app/*" = ["TC001", "TC002", "TC003", "S105", "S106", "S108"]
"apps/worker/*" = ["TC001", "TC002", "TC003", "ANN", "S108", "E402", "I001"]
"packages/*" = ["TC001", "TC002", "TC003", "E402", "I001", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
explicit_package_bases = true
mypy_path = "."
# Practical checks — catches real bugs without requiring full annotation coverage
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "apps/api", "apps/worker", "apps/eval", "packages/ast_parser/src", "packages/llm_gateway/src", "packages/core/src"]
testpaths = ["apps/api/tests", "apps/worker/tests", "apps/eval/tests"]
