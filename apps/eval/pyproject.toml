[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens-eval"
version = "0.1.0"
description = "RAGAS Evaluation Harness for CodeLens"
authors = [{ name = "CodeLens Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
ragas = [
    "ragas>=0.1.0",
    "datasets>=2.18.0",
    "langchain>=0.1.0",
    "openai>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
