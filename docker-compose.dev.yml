services:
  api:
    volumes:
      - ./apps/api:/app
      - ./packages:/packages
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development

  worker:
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./apps/api:/app/apps/api
      - ./packages:/packages
    command: watchfiles "celery -A apps.worker.celery_app worker --loglevel=debug -Q high,default,low --concurrency=2" /app

  beat:
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./apps/api:/app/apps/api
      - ./packages:/packages
