[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codelens-llm-gateway"
version = "0.1.0"
description = "Multi-provider LLM gateway for CodeLens"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
